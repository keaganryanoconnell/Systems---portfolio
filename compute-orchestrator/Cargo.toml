[package]
name = "compute-orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cloud-native distributed compute layer — actor-driven compute engine with SWIM gossip, dynamic task scheduling, OpenTelemetry tracing, and automated DevOps pipeline"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
