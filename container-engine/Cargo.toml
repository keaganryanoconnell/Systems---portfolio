[package]
name = "container-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Production-grade Linux container runtime — namespace isolation, cgroups v2 resource control, seccomp-BPF security, OverlayFS, veth networking"

[dependencies]
nix = { version = "0.29", features = [
    "fs", "mount", "sched", "signal", "socket", "net",
    "user", "uio", "process", "event", "mman",
] }
clap = { version = "4", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
once_cell = "1"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"

[dev-dependencies]
tempfile = "3"

[features]
default = []
advanced-security = []

[[bin]]
name = "container-engine"
path = "src/main.rs"
