[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
core-sys = { path = "../core-sys" }

[build-dependencies]
tauri-build = { version = "1.5" }
