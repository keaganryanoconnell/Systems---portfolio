[package]
name = "columnar-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance in-browser columnar OLAP data engine — zero-copy WASM ingestion, bounded LRU memory pool, vectorized spatial queries"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
