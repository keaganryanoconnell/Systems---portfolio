[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-throughput HTTP/TLS 1.3 API gateway — routes SQL queries to sql-engine, compute jobs to orchestrator, exposes cluster health and metrics"

[dependencies]
common-protocol = { path = "../common-protocol" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
