[package]
name = "ingestion-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-throughput binary ingestion server — io_uring zero-copy receive on Linux, tokio TCP/UDP fallback on all platforms"

[[bin]]
name = "ingestion-server"
path = "src/main.rs"

[dependencies]
common-protocol = { path = "../common-protocol" }
columnar-engine = { path = "../columnar-engine" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
