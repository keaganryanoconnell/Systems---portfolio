[package]
name = "sync-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Real-time CRDT sync server — WebTransport/QUIC on Linux, WebSocket fallback on all platforms"

[[bin]]
name = "sync-server"
path = "src/main.rs"

[dependencies]
common-protocol = { path = "../common-protocol" }
crdt-engine = { path = "../crdt-engine" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
