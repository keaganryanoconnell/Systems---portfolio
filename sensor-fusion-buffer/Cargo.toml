[package]
name = "sensor-fusion-buffer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lock-free MPMC concurrent ring buffer for high-frequency LiDAR/Camera/IMU sensor fusion — CAS-producer coordination, deterministic overwrite, CPU affinity, TSAN-verified data-race-free"

[dependencies]
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false
